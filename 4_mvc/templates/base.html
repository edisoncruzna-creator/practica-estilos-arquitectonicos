<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas · MVC</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #0B2545; }
    nav a { margin-right: 1rem; color: #13A89E; font-weight: 600; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { padding: .5rem .75rem; border-bottom: 1px solid #dde5ee; text-align: left; }
    th { background: #0B2545; color: #fff; }
    .ok { color: #2e7d4f; font-weight: 600; } .mal { color: #c0392b; font-weight: 600; }
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .tarjeta { border-radius: 10px; padding: 1rem; background: #EEF4F8; }
    .tarjeta b { font-size: 1.8rem; display: block; }
    .aviso { background: #fff4e0; padding: .75rem; border-radius: 8px; margin-top: 1rem; }
    input, select, button { padding: .4rem; font-size: 1rem; }
  </style>
</head>
<body>
  <nav><a href="/">Vista tabla</a><a href="/tarjetas">Vista tarjetas</a></nav>
  {% block contenido %}{% endblock %}
</body>
</html>
